contract_version: "1.0"
project: FraudLens
phase: 8
issue: 84
owner: Shreyash2942
status: design_defined
decision_date: "2026-11-17"
strategy_document: documents/cicd-strategy-release-model.md
scope:
  - validation
  - merge_control
  - candidate_identity
  - environment_promotion
  - release_evidence
implementation_issues: [85, 86, 87, 88, 89, 90, 91]
baseline:
  source_commit: 0be6db22652c135df81aaad885e251a52d1bf314
  workflow: .github/workflows/pr-validation.yml
  existing_check: dbt Structure Validation
  existing_triggers: [pull_request_path_filtered, workflow_dispatch]
  protected_main: false
  repository_rulesets: []
  github_environments: []
  published_releases: []
validation:
  policy_status: planned
  aggregate_check: CI Summary
  gates: [repository_standards, python_validation, dbt_validation]
  required_summary_on_every_pull_request: true
  unjustified_skip_or_missing_result: fail
  cancelled_required_check: fail
  pull_request_runner: ephemeral_github_hosted
  default_token_permissions:
    contents: read
  pull_request_deployment_secrets: false
  untrusted_pull_request_on_persistent_self_hosted_runner: false
  privileged_pull_request_target_executes_untrusted_code: false
  clean_workspace_required: true
candidate:
  source_branch: main
  post_merge_revalidation_required: true
  identity_fields: [commit_sha, workflow_run_id, workflow_run_attempt, artifact_digest]
  changed_commit_or_configuration_requires_revalidation: true
  evidence_retention_days: 30
  evidence_fields:
    - pull_request
    - tested_head_and_merge_shas
    - dependency_versions
    - manifest_digest
    - gate_outcomes
    - configuration_fingerprint_without_secrets
    - operator_owner
  include_secrets_or_generated_banking_data: false
branches:
  policy_status: planned
  integration: main
  feature_pattern: NN-short-slug
  phase_8_branch: 83-phase-8-cicd-implementation
  permanent_environment_branches: false
  pull_request_required: true
  phase_merge_method: merge_commit
  required_check: CI Summary
  require_current_revision: true
  require_up_to_date_integration: true
  resolve_conversations_before_merge: true
  independent_approval_when_qualified_reviewer_available: true
  sole_maintainer_acceptance_note_required: true
  sole_maintainer_acceptance_is_independent_review: false
  allow_main_force_push: false
  enable_required_checks_only_after_verified_on_main: true
  enforcement_owner_issue: 89
  exception_fields: [owner, reason, affected_control, approved_scope, timestamp, compensating_validation, follow_up_issue]
promotion:
  policy_status: planned
  required_portfolio_path: [local_development, pull_request_ci, main_candidate, dev, release_record]
  optional_cloud_path: [dev, test, prod]
  trigger: workflow_dispatch
  automatic_after_merge: false
  candidate_source_branch: main
  verify_candidate_digest_before_deployment: true
  preflight_existing_environment_protections: true
  implicit_environment_creation_is_approval: false
  full_ci_orchestration_profile_is_offline_validation: false
  environments:
    dev:
      activation: pending_implementation
      runtime: external_data_lab_spark_hive
      runtime_profile: local
      approval: recorded_owner_approval
      runner: explicitly_configured_trusted_isolated_runtime_access
      required_evidence: [success_run, controlled_failure_recovery, quality_gates, correlated_logs_artifacts_metrics_lineage]
    test:
      activation: disabled_by_default
      runtime: snowflake_nonproduction
      runtime_profile: snowflake
      profile_readiness: scaffold_only
      prerequisites: [dev_qualified_same_candidate, implemented_cloud_path, separate_database_schema_role, environment_protections]
      approval: independent_authorized_reviewer
      self_approval_allowed: false
    prod:
      activation: disabled_by_default
      runtime: snowflake_production
      runtime_profile: snowflake
      profile_readiness: scaffold_only
      prerequisites: [test_qualified_same_candidate, separate_production_identity, migration_restore_plan, environment_protections]
      approval: independent_authorized_reviewer
      self_approval_allowed: false
  credentials:
    scope: selected_github_environment
    commit_secret_values: false
    put_secret_values_in_artifacts: false
  implementation_owner_issues: [88, 89, 90]
release:
  policy_status: planned
  version_pattern: v0.MINOR.PATCH
  automatic_on_phase_completion: false
  validated_environment_must_be_named: true
  immutable_tag_required: true
  candidate_digest_verification_required: true
  release_evidence_index_required: true
  deployment_concurrency: serialize_per_environment
  cancel_deployment_in_progress: false
  rollback_data_by_reverting_code: false
