name: Code Validation

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Baseline Repository Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate repository foundation
        run: |
          python - <<'PY'
          import subprocess
          required = ["README.md", "AGENTS.md", "CONTRIBUTING.md", "specs/README.md", "standards/README.md"]
          subprocess.run(["git", "ls-files", "--error-unmatch", "--", *required], check=True)
          print("Required repository foundations are tracked.")
          PY

  ci-summary:
    name: CI Summary
    needs: [repository-checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful baseline checks
        env:
          BASELINE_RESULT: ${{ needs.repository-checks.result }}
        run: >-
          python -c 'import os, sys; result = os.environ.get("BASELINE_RESULT", ""); print("Baseline Repository Checks: " + (result or "missing")); sys.exit(0 if result == "success" else 1)'
