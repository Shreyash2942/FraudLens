name: Code Validation

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Baseline Repository Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install baseline validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Test CI validation and failure propagation
        run: python -m unittest discover -s tests/ci -p 'test_*.py' -v

      - name: Validate tracked repository files
        run: python scripts/ci/validate_repository.py --report .ci-artifacts/repository-checks.json

      - name: Preserve baseline validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/repository-checks.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  ci-summary:
    name: CI Summary
    needs: [repository-checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful baseline checks
        env:
          BASELINE_RESULT: ${{ needs.repository-checks.result }}
        run: >-
          python -c 'import os, sys; result = os.environ.get("BASELINE_RESULT", ""); print("Baseline Repository Checks: " + (result or "missing")); sys.exit(0 if result == "success" else 1)'
