name: Controlled Deployment

"on":
  workflow_call:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify candidate or deploy after environment approval
        type: choice
        options: [verify, deploy]
        default: verify
      environment:
        description: Only dev is implemented; cloud targets remain blocked
        type: choice
        options: [dev, test, prod]
        default: dev
      candidate_sha:
        description: Full validated main commit SHA
        type: string
        required: true
      ci_run_id:
        description: Successful push-to-main Code Validation run
        type: string
        required: true
      candidate_sha256:
        description: Candidate tar SHA-256 from the CI bundle report
        type: string
        required: true
      owner_approval:
        description: Repeat the candidate SHA to record owner acceptance
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Candidate Bundle
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Check deployment workflow context
        run: python -c "import os; print('Candidate packaging context:', os.environ['GITHUB_EVENT_NAME'])"
