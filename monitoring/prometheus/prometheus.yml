global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fraudlens_metrics_exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9108
        labels:
          environment: local
          service_name: fraudlens_metrics_exporter

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090
        labels:
          environment: local
          service_name: prometheus

  - job_name: airflow
    metrics_path: /health
    static_configs:
      - targets:
          - localhost:8080
        labels:
          environment: local
          service_name: airflow

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:3000
        labels:
          environment: local
          service_name: grafana

  - job_name: marquez
    metrics_path: /api/v1/namespaces
    static_configs:
      - targets:
          - localhost:5000
        labels:
          environment: local
          service_name: marquez

  - job_name: mongodb
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9216
        labels:
          environment: local
          service_name: mongodb

  - job_name: spark_hive_runtime
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9109
        labels:
          environment: local
          service_name: spark_hive_runtime
