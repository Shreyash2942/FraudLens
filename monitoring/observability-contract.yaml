metrics_contract_version: 1.0
lineage_contract_version: 1.0

metrics:
  namespace_pattern: fraudlens.orchestration.<profile>
  prometheus_metric_prefix: fraudlens_
  stream_path_pattern: airflow/artifacts/observability/metrics/<workflow>/<run_stamp>/metric_events.jsonl
  required_fields:
    - metric_name
    - metric_value
    - metric_type
    - emitted_at_utc
    - dag_id
    - run_id
    - batch_id
    - run_profile
    - run_target
    - workflow
  required_labels:
    - environment
    - run_profile
    - run_target
    - dag_id
    - workflow
    - stage
    - status
  controlled_labels:
    - task_id
    - batch_id
    - dataset_name
    - failure_category
    - quality_gate
    - severity
    - service_name
    - lineage_namespace
    - lineage_event_type
  blocked_label_sources:
    - raw_exception_message
    - full_file_path
    - command_text
    - sql_text
    - timestamp
  metric_types:
    - gauge
    - counter
    - histogram
  operational_goals:
    - latest_pipeline_run_status
    - stage_bottleneck_detection
    - failed_quality_gate_explainability
    - artifact_completeness_review
    - lineage_emission_coverage
    - service_health_visibility
  metric_categories:
    pipeline_execution:
      purpose: Track run, stage, task, retry, and failure outcomes.
      canonical_metrics:
        - pipeline_run_status
        - pipeline_run_duration_seconds
        - pipeline_stage_status
        - pipeline_stage_duration_seconds
        - pipeline_task_attempt_total
        - pipeline_task_retry_total
        - pipeline_failure_total
    data_governance:
      purpose: Track artifact completeness, dataset throughput, quality gates, and freshness.
      canonical_metrics:
        - pipeline_artifact_completeness
        - pipeline_dataset_processed_total
        - pipeline_quality_gate_total
        - pipeline_quality_failure_total
        - pipeline_freshness_lag_seconds
    lineage_health:
      purpose: Track local lineage event generation and external delivery behavior.
      canonical_metrics:
        - pipeline_lineage_event_total
        - pipeline_lineage_delivery_total
        - pipeline_lineage_delivery_latency_seconds
    system_health:
      purpose: Track local runtime and observability service availability.
      canonical_metrics:
        - service_health_status
        - service_response_time_seconds
        - runtime_cpu_utilization_percent
        - runtime_memory_utilization_percent
        - runtime_disk_free_bytes
  canonical_metrics:
    - metric_name: pipeline_run_status
      metric_type: gauge
      value_rule: 1 for success, 0 for failure
    - metric_name: pipeline_artifact_completeness
      metric_type: gauge
      value_rule: completed_stage_artifacts / expected_stage_artifacts
    - metric_name: pipeline_run_duration_seconds
      metric_type: gauge
      value_rule: ended_at_utc - started_at_utc
    - metric_name: pipeline_stage_status
      metric_type: gauge
      value_rule: 1 for success, 0 for failure or blocked
    - metric_name: pipeline_stage_duration_seconds
      metric_type: gauge
      value_rule: stage_ended_at_utc - stage_started_at_utc
    - metric_name: pipeline_task_attempt_total
      metric_type: counter
      value_rule: increment by task attempt and status
    - metric_name: pipeline_task_retry_total
      metric_type: counter
      value_rule: increment by task retry and failure_category
    - metric_name: pipeline_failure_total
      metric_type: counter
      value_rule: increment by failed stage, task, and failure_category
    - metric_name: pipeline_dataset_processed_total
      metric_type: counter
      value_rule: increment by dataset processed by stage
    - metric_name: pipeline_quality_gate_total
      metric_type: counter
      value_rule: increment by quality_gate, severity, and status
    - metric_name: pipeline_quality_failure_total
      metric_type: counter
      value_rule: increment by failed quality_gate and severity
    - metric_name: pipeline_freshness_lag_seconds
      metric_type: gauge
      value_rule: observed_completion_time - batch_effective_time where available
    - metric_name: pipeline_lineage_event_total
      metric_type: counter
      value_rule: increment by lineage_event_type and status
    - metric_name: pipeline_lineage_delivery_total
      metric_type: counter
      value_rule: increment by delivery status for external lineage endpoint attempts
    - metric_name: pipeline_lineage_delivery_latency_seconds
      metric_type: gauge
      value_rule: external lineage delivery completion - delivery start
    - metric_name: service_health_status
      metric_type: gauge
      value_rule: 1 for healthy, 0 for unhealthy
    - metric_name: service_response_time_seconds
      metric_type: gauge
      value_rule: health probe response duration
    - metric_name: runtime_cpu_utilization_percent
      metric_type: gauge
      value_rule: runtime CPU utilization percent when exporter is available
    - metric_name: runtime_memory_utilization_percent
      metric_type: gauge
      value_rule: runtime memory utilization percent when exporter is available
    - metric_name: runtime_disk_free_bytes
      metric_type: gauge
      value_rule: free bytes for local runtime storage paths when exporter is available

lineage:
  namespace_pattern: fraudlens.orchestration.<profile>
  stream_path_pattern: airflow/artifacts/observability/lineage/<workflow>/<run_stamp>/lineage_events.jsonl
  required_fields:
    - event_type
    - event_time_utc
    - namespace
    - job_name
    - run_id
    - batch_id
    - run_profile
    - status
    - inputs
    - outputs
  event_types:
    - pipeline_run_completed
    - stage_transition
    - quality_gate_result
  status_values:
    - SUCCESS
    - FAILED
    - PARTIAL
